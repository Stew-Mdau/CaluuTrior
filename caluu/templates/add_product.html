{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - CaluuTrior</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        /* Preview styling */
        #preview-container { display: none; margin-bottom: 20px; }
        #image-preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: 15px; border: 2px dashed #ddd; padding: 5px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="mb-3 d-flex justify-content-between">
                <a href="{% url 'product_list' %}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">← Back to Shop</a>
                {# <a href="{% url 'product_list' %}" class="text-muted small mt-1">Main Page</a> #}
            </div>

            <div class="card form-card p-4">
                <h2 class="fw-bold text-center mb-4">Add New Product</h2>
                
                <div id="preview-container" class="text-center">
                    <p class="small text-muted">Image Preview:</p>
                    <img id="image-preview" src="#" alt="Preview">
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Style the inputs
    document.querySelectorAll('input, select, textarea').forEach(el => {
        el.classList.add('form-control');
        el.classList.add('rounded-3');
    });

    // 2. The Preview Logic
    const imageInput = document.querySelector('input[type="file"]');
    const previewContainer = document.getElementById('preview-container');
    const previewImage = document.getElementById('image-preview');

    imageInput.onchange = evt => {
        const [file] = imageInput.files;
        if (file) {
            previewImage.src = URL.createObjectURL(file);
            previewContainer.style.display = 'block';
        }
    }
</script>
</body>
</html>
